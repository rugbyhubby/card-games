<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pitch">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Pitch</title>
<script>/* Use the theme from the link right away, so the page doesn't flash the other theme first. */(function(){var m=/[#&]theme=(light|dark)(&|$)/.exec(location.hash);if(m)document.documentElement.dataset.theme=m[1];})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/theme.css">
<link rel="stylesheet" href="../../../shared/parts.css">
<style>
/* Pitch only: trump badge, the bid in the center, bid buttons, end-of-hand points */
.trump{position:absolute;top:8px;left:10px;font-size:12px;color:var(--muted);line-height:1.3}
.trump b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;color:var(--ink)}
.trump b.r{color:var(--red)}
.pile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px}
.pile .bigbid{font-family:var(--serif);font-size:48px;line-height:1}
.pile .cap{font-size:12px;color:var(--muted);text-align:center}
.btn.num{width:48px;padding:9px 0}
.sheet .pts{display:block;text-align:left;margin:0 0 12px;padding:8px 0;border-top:1px solid var(--faint);border-bottom:1px solid var(--faint)}
.sheet .pt{display:block;font-size:14px;line-height:1.6}
.sheet .pt b{display:inline-block;width:52px;font-weight:600}
.sheet .r{color:var(--red)}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
