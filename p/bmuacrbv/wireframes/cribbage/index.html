<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Cribbage wireframes</title>
<!--
  Cribbage wireframes (Step 0). Deliberately rough: gray boxes, card outlines,
  fake data, tap to advance. No game rules run here, and nothing is saved.
  Not linked from the game list, not cached for offline. Delete once Cribbage ships.
-->
<style>
:root{color-scheme:light;--ink:#222;--mute:#777;--line:#bbb;--fill:#e6e6e6;--mark:#ffe14d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font:15px/1.35 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{max-width:430px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.serif{font-family:Georgia,serif}

/* wireframe chrome (not part of the design) */
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;background:#333;color:#fff;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;font-size:13px}
.bar button{background:none;border:1px solid #888;border-radius:6px;color:#fff;padding:3px 9px;font-size:13px}
.bar .where{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cap{background:#fff7cc;border-bottom:1px solid #e3cf63;padding:8px 12px;font-size:13.5px;min-height:56px}
.cap .covers{display:block;margin-top:4px;font-size:12.5px;color:#6a5a00}
.cap .tap{display:block;margin-top:3px;font-size:11.5px;color:#998}

/* home */
.home{padding:14px 14px 30px}
.home h1{font:400 30px Georgia,serif;margin:4px 0 2px}
.home p{margin:4px 0 12px;color:var(--mute);font-size:14px}
.home h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 6px}
.home a{display:flex;gap:10px;align-items:baseline;padding:11px 4px;border-bottom:1px solid #e3e3e3;color:inherit;text-decoration:none}
.home a b{width:30px;flex:none;font-family:Georgia,serif;font-weight:400;font-size:19px}
.home a span{flex:1}
.home a small{display:block;color:var(--mute);font-size:12.5px}

/* the phone table */
.ph{flex:1;display:flex;flex-direction:column;padding:4px 12px 8px;position:relative;overflow:hidden;min-height:620px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid var(--ink);padding:2px 0 5px}
.hd .t{font:400 25px Georgia,serif}
.hd .s{display:flex;gap:14px}
.hd .s div{text-align:center;line-height:1}
.hd .s b{display:block;font:400 25px Georgia,serif}
.hd .s span{font-size:11px;color:var(--mute)}
.ctl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);padding:4px 0 2px}
.ctl u{color:var(--ink)}
.top{display:flex;align-items:center;gap:10px;min-height:62px;position:relative}
.seat{display:flex;align-items:center;gap:8px;position:relative}
.av{width:40px;height:40px;border:1.5px solid var(--ink);border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:10px;flex:none}
.turn .av,.me.turn .dot{background:var(--mark)}
.nm{font-size:13px;display:flex;gap:5px;align-items:center}
.chip{background:var(--mark);border-radius:99px;font-size:10px;padding:1px 6px;font-weight:600}
.fan{display:flex;margin-top:3px;height:18px}
.mini{width:12px;height:18px;border:1.2px solid var(--ink);border-radius:2px;background:var(--fill);margin-left:-5px}
.mini:first-child{margin-left:0}
.bub{position:absolute;left:30px;top:-6px;transform:translateY(-100%);background:var(--ink);color:#fff;font-size:12px;padding:2px 9px;border-radius:10px;white-space:nowrap;z-index:3}
.bub.pts{background:var(--mark);color:var(--ink);font-weight:600;border:1.5px solid var(--ink)}
.me{display:flex;align-items:center;gap:7px;font-size:13px;min-height:26px;position:relative}
.me .dot{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:50%;background:var(--fill)}
.me .bub{left:12px}
.grow{flex:1}

.cd{width:44px;height:62px;border:1.5px solid var(--ink);border-radius:5px;background:#fff;position:relative;font:16px Georgia,serif;padding:3px 4px;flex:none;line-height:1;transition:transform .15s}
.cd.r{color:#c22}
.cd .p{position:absolute;right:4px;bottom:3px;font-size:18px}
.cd.bk{background:repeating-linear-gradient(45deg,#c9c9c9 0 1px,#f4f4f4 1px 5px)}
.cd.sm{width:32px;height:45px;font-size:13px;padding:2px 3px;border-radius:4px}
.cd.sm .p{font-size:13px;right:3px;bottom:2px}
.cd.hl{box-shadow:0 0 0 3px var(--mark);background:#fff6bf}
.cd.up{transform:translateY(-10px);box-shadow:0 0 0 3px var(--mark)}
.cd.dim{opacity:.3}
.cd.sel{outline:2.5px dashed var(--ink);outline-offset:2px}
.pile{position:relative;width:36px;height:49px}
.pile .cd{position:absolute;left:0;top:0}
.pile .cd:nth-child(2){left:2px;top:-2px}.pile .cd:nth-child(3){left:4px;top:-4px}.pile .cd:nth-child(4){left:6px;top:-6px}
.stk{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mute)}
.stk.hlx .pile .cd:last-child{box-shadow:0 0 0 3px var(--mark)}

.mid{display:flex;align-items:stretch;gap:8px;margin:6px 0;position:relative}
.side{display:flex;flex-direction:column;justify-content:center;gap:10px;align-items:center;width:46px}
.pa{flex:1;border:1.5px dashed var(--line);border-radius:14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 4px;position:relative}
.played{display:flex;align-items:center;height:62px}
.played .cd{margin-left:-14px}
.played .cd:first-child{margin-left:0}
.played .cd.cpu{transform:translateY(-7px)}
.played .cd.you{transform:translateY(7px)}
.played .sep{width:12px}
.cnt{font-size:13px;color:var(--mute)}
.cnt b{font:400 22px Georgia,serif;color:var(--ink)}
.rows2{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.rows2 .lab{font-size:10px;color:var(--mute);align-self:flex-start;margin-left:6px}

.msg{text-align:center;font-size:14px;min-height:22px;padding:2px 4px}
.acts{display:flex;justify-content:center;gap:8px;min-height:40px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);border-radius:99px;background:#fff;padding:7px 14px;font-size:14px}
.btn.pri{background:var(--ink);color:#fff}
.btn.off{opacity:.35}
.hand{display:flex;justify-content:center;gap:4px;padding:10px 0 4px;min-height:86px}
.hand .cd{width:min(14.5vw,54px);height:calc(min(14.5vw,54px)*1.4);font-size:19px}
.hand .cd .p{font-size:22px}
.foot{text-align:center;font-size:10.5px;color:var(--mute)}
.dealt{animation:deal .35s ease-out backwards}
@keyframes deal{from{opacity:0;transform:translateY(-40px) rotate(-8deg)}}

/* board */
.board svg{display:block;width:100%;height:auto}
.strip{margin:2px 0}
.big-board svg{width:100%;height:auto;max-height:520px}
.l2grid{display:grid;grid-template-columns:1fr 80px;gap:6px;flex:1;min-height:0}
.vboard{display:flex;justify-content:center;align-items:flex-start}
.vboard svg{width:auto;height:330px}

/* counting */
.cl{font-size:12px;color:var(--mute)}
.cards{display:flex;gap:4px;align-items:center}
.cards .gap{width:10px}
.say{font:400 17px Georgia,serif;text-align:center;min-height:44px;padding:0 6px}
.say b{font-weight:400;background:var(--mark);padding:0 4px;border-radius:3px}
.claims{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:12px}
.claims span{border:1px solid var(--ink);border-radius:99px;padding:1px 8px}
.step{display:flex;align-items:center;gap:10px}
.step .btn{width:40px;padding:6px 0}
.step b{font:400 30px Georgia,serif;width:46px;text-align:center}

/* sheets and celebrations */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.35);display:grid;place-items:center;z-index:8}
.sheet{background:#fff;border:1.5px solid var(--ink);border-radius:16px;padding:18px;width:88%;text-align:center}
.sheet h2{font:400 30px Georgia,serif;margin:0 0 6px}
.sheet p{margin:0 0 12px;font-size:14px}
.sheet .set{text-align:left;font-size:13px}
.sheet .set h3{font-size:12.5px;margin:12px 0 5px}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:99px;overflow:hidden}
.seg span{flex:1;text-align:center;padding:5px 0;font-size:13px}
.seg span.on{background:var(--ink);color:#fff}
.note{font-size:11.5px;color:var(--mute);margin-top:4px}
.cele{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:rgba(255,255,255,.88);animation:fade .3s}
.cele .in{text-align:center;animation:boom .5s cubic-bezier(.2,1.4,.4,1)}
.cele svg{width:220px;height:220px;display:block;margin:0 auto -150px}
.cele .big{font:400 92px Georgia,serif;line-height:1;position:relative}
.cele .big.word{font-size:56px}
.cele .c1{font-size:17px;margin-top:62px}
.cele .c2{font-size:12.5px;color:var(--mute);margin-top:6px}
.cele.small svg{width:160px;height:160px;margin-bottom:-115px}
@keyframes fade{from{opacity:0}}
@keyframes boom{from{transform:scale(.6);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ---------- tiny helpers ----------
const SYM = { S: '♠', H: '♥', C: '♣', D: '♦' };
const rk = id => id.slice(0, -1), st = id => id.slice(-1);
const card = (id, cls = '') => {
  if (id === 'bk') return `<div class="cd bk ${cls}"></div>`;
  const red = st(id) === 'H' || st(id) === 'D' ? ' r' : '';
  return `<div class="cd${red} ${cls}" data-id="${id}">${rk(id)}<br>${SYM[st(id)]}<span class="p">${SYM[st(id)]}</span></div>`;
};
const backs = n => Array.from({ length: n }, () => card('bk', 'sm')).join('');
const minis = n => '<div class="mini"></div>'.repeat(n);

// ---------- the board: a real-style racetrack, one lane per player ----------
// Drawn standing up: 1-35 up the left, around the top (36-44), 45-80 down the right,
// around the bottom (81-84), then 85-120 up the middle to Finish (121).
// Lying across the table it's the same drawing turned a quarter turn (Start on the left).
const BD = { Lc: 10, Mc: 30, Rc: 50, Y0: 30, dy: 5, G: 3, W: 68, H: 248 };
const YB = BD.Y0 + 35 * BD.dy + 7 * BD.G;                  // bottom of the right and middle columns
const yL = n => BD.Y0 + (35 - n) * BD.dy + (6 - Math.floor((n - 1) / 5)) * BD.G;
const yR = n => BD.Y0 + (n - 45) * BD.dy + (n <= 45 ? 0 : Math.floor((n - 46) / 5) + 1) * BD.G;
const yM = n => YB - (n - 85) * BD.dy - (n <= 85 ? 0 : Math.floor((n - 86) / 5) + 1) * BD.G;
const COLOR = { you: '#d0312d', cpu: '#2f5fd0' };          // you red, Computer blue
const LANE = { you: 0, cpu: 1 };                            // 0 = outer lane
function holeUp(n, lane) {                                  // position on the upright board
  const d = lane ? 3 : -3;
  if (n <= 0) return [BD.Lc + d, yL(1) + 9];
  if (n <= 35) return [BD.Lc + d, yL(n)];
  if (n <= 44) { const t = Math.PI - (n - 35) * Math.PI / 10, r = 20 - d; return [30 + r * Math.cos(t), BD.Y0 - r * Math.sin(t)]; }
  if (n <= 80) return [BD.Rc - d, yR(n)];
  if (n <= 84) { const t = -(n - 80) * Math.PI / 5, r = 10 - d; return [40 + r * Math.cos(t), YB - r * Math.sin(t)]; }
  if (n <= 120) return [BD.Mc + d, yM(n)];
  return [BD.Mc, BD.Y0 - 9];
}
const holeXY = (n, lane, across) => { const [x, y] = holeUp(n, lane); return across ? [BD.H - y, x] : [x, y]; };
const r1 = v => Math.round(v * 10) / 10;

// b = { you:[back,front], cpu:[back,front], move:{who, to} }; across = lying sideways
function boardSVG(b, across = true) {
  const P = (x, y) => { const [a, c] = across ? [BD.H - y, x] : [x, y]; return r1(a) + ' ' + r1(c); };
  const track = d => `M${P(BD.Lc + d, yL(1) + 14)} L${P(BD.Lc + d, BD.Y0)} A${20 - d} ${20 - d} 0 0 1 ${P(BD.Rc - d, BD.Y0)} L${P(BD.Rc - d, YB)} A${10 - d} ${10 - d} 0 0 1 ${P(BD.Mc + d, YB)} L${P(BD.Mc + d, BD.Y0 - 3)}`;
  let h = [-6, 0, 6].map(d => `<path d="${track(d)}" fill="none" stroke="var(--ink)" stroke-width="${d ? .7 : .4}"/>`).join('');
  for (const lane of [0, 1]) for (let n = 0; n <= 120; n++) {
    const [x, y] = holeXY(n, lane, across);
    h += `<circle cx="${r1(x)}" cy="${r1(y)}" r="${n ? 1.15 : 1.6}" fill="${n ? '#555' : 'none'}" stroke="#555" stroke-width="${n ? 0 : .6}"/>`;
  }
  const [fx, fy] = holeXY(121, 0, across);
  h += `<circle cx="${r1(fx)}" cy="${r1(fy)}" r="1.8" fill="none" stroke="var(--ink)" stroke-width=".7"/>`;
  const text = (x, y, s, size = 3.2, fill = '#777') => { const [a, c] = P(x, y).split(' '); return `<text x="${a}" y="${+c + size / 3}" font-size="${size}" fill="${fill}" text-anchor="middle">${s}</text>`; };
  for (let n = 5; n <= 35; n += 5) h += text(20, yL(n), n);
  for (let n = 45; n <= 80; n += 5) h += text(62, yR(n), n);
  for (let n = 85; n <= 120; n += 5) h += text(40, yM(n), n);
  h += text(BD.Mc, BD.Y0 - 4.5, 'FINISH', 2.4) + text(BD.Lc, yL(1) + 18, 'START', 2.6);
  // skunk lines: under 91 at the end = skunk, under 61 = double skunk
  const line = (x, ya, yb, lab) => { const y = (ya + yb) / 2; return `<path d="M${P(x - 7, y)} L${P(x + 7, y)}" stroke="var(--ink)" stroke-width=".9" stroke-dasharray="1.2 .8"/>` + text(x + (x === BD.Mc ? -10 : 12), y, lab, 3.6, 'var(--ink)'); };
  h += line(BD.Mc, yM(90), yM(91), 'S') + line(BD.Rc, yR(60), yR(61), 'SS');
  // pegs: two per player; a scoring move steps the back peg hole by hole past the front one
  for (const who of ['cpu', 'you']) {
    const [bk, fr] = b[who], lane = LANE[who];
    const mv = b.move && b.move.who === who;
    for (const [n, moving] of [[fr, false], [bk, mv]]) {
      const [x, y] = holeXY(n, lane, across);
      h += `<g class="peg" style="transform:translate(${r1(x)}px,${r1(y)}px)" ${moving ? `data-mv="${who}" data-from="${n}" data-to="${b.move.to}" data-lane="${lane}" data-across="${across ? 1 : ''}"` : ''}><circle r="2.3" fill="${COLOR[who]}" stroke="#222" stroke-width=".5"/></g>`;
    }
  }
  const [w, hh] = across ? [BD.H, BD.W] : [BD.W, BD.H];
  return `<svg viewBox="0 0 ${w} ${hh}" aria-label="Cribbage board">${h}</svg>`;
}
const dot = who => `<i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${COLOR[who]};margin-right:3px"></i>`;

// ---------- the table ----------
// o: layout (1|2), sc [you, cpu], dealer, cpuN, crib (count), starter (id|'bk'|null), starterHL,
//    peg {cards:[[who,id,cls]], count}, center (html), msg, acts, hand [[id,cls]], board {mode, you, cpu, move},
//    said {cpu, you}, pts {cpu, you}, turn ('you'|'cpu'), over (html on top), extra (html)
function T(o) {
  o = Object.assign({ layout: 1, sc: [0, 0], dealer: 'cpu', cpuN: 4, crib: 0, starter: null, msg: '', acts: '', hand: [], board: { mode: 'strip', you: [0, 0], cpu: [0, 0] }, said: {}, pts: {} }, o);
  const b = o.board;
  const scoreYou = b.move && b.move.who === 'you' ? `<b data-final="${o.scAfter ?? o.sc[0]}">${o.sc[0]}</b>` : `<b>${o.sc[0]}</b>`;
  const scoreCpu = b.move && b.move.who === 'cpu' ? `<b data-final="${o.scAfter ?? o.sc[1]}">${o.sc[1]}</b>` : `<b>${o.sc[1]}</b>`;
  const bubble = w => (o.said[w] ? `<div class="bub">${o.said[w]}</div>` : '') + (o.pts[w] ? `<div class="bub pts">${o.pts[w]}</div>` : '');
  const crib = (w) => o.crib && o.dealer === w ? `<div class="stk"><div class="pile">${backs(Math.min(o.crib, 4))}</div>${w === 'you' ? 'Your crib' : 'Crib'}</div>` : '';
  const starter = `<div class="stk${o.starterHL ? ' hlx' : ''}"><div class="pile">${backs(2)}${o.starter && o.starter !== 'bk' ? card(o.starter, 'sm' + (o.starterHL ? ' hl' : '')) : ''}</div>${o.starter && o.starter !== 'bk' ? 'Starter' : 'Deck'}</div>`;
  const cpuSeat = `<div class="seat${o.turn === 'cpu' ? ' turn' : ''}">${bubble('cpu')}<div class="av">CPU</div><div><div class="nm">Computer${o.dealer === 'cpu' ? ' <span class="chip">Dealer</span>' : ''}</div><div class="fan">${minis(o.cpuN)}</div></div></div>`;
  const me = `<div class="me${o.turn === 'you' ? ' turn' : ''}">${bubble('you')}<span class="dot"></span>You${o.dealer === 'you' ? ' <span class="chip">Dealer</span>' : ''}<span class="grow"></span>${o.layout === 1 ? crib('you') : ''}</div>`;
  let center = o.center;
  if (!center && o.peg) {
    const P = o.peg;
    if (o.layout === 2) {
      const row = w => `<div class="played">${P.cards.filter(c => c[0] === w).map(c => card(c[1], 'sm ' + (c[2] || ''))).join('') || '<div class="cd sm" style="visibility:hidden"></div>'}</div>`;
      center = `<div class="rows2"><span class="lab">Computer's cards</span>${row('cpu')}<div class="cnt">Count: <b>${P.count}</b></div>${row('you')}<span class="lab">Your cards</span></div>`;
    } else {
      center = `<div class="played">${P.cards.map(c => c[0] === '|' ? '<span class="sep"></span>' : card(c[1], 'sm ' + c[0] + ' ' + (c[2] || ''))).join('')}</div><div class="cnt">Count: <b>${P.count}</b></div>`;
    }
  }
  center = center || '<div class="cnt">&nbsp;</div>';
  const hand = `<div class="hand">${o.hand.map(([id, cls], i) => card(id, (cls || '') + (o.dealt ? ' dealt' : '')).replace('class="', `style="animation-delay:${i * 90}ms" class="`)).join('')}</div>`;
  const header = `<div class="hd"><div class="t">Cribbage</div><div class="s"><div>${scoreYou}<span>You</span></div><div>${scoreCpu}<span>Computer</span></div></div></div>
    <div class="ctl"><span>Medium level${o.muggins ? ' · Muggins on' : ''}</span><u>Menu</u></div>`
    .replace('<span>You</span>', `<span>${dot('you')}You</span>`).replace('<span>Computer</span>', `<span>${dot('cpu')}Computer</span>`);
  let h;
  if (o.layout === 2) {
    h = `${header}<div class="l2grid"><div style="display:flex;flex-direction:column">
        <div class="top">${cpuSeat}</div>
        <div class="mid"><div class="side">${o.dealer === 'cpu' ? crib('cpu') : ''}${starter}${o.dealer === 'you' ? crib('you') : ''}</div><div class="pa">${center}</div></div>
        ${me}</div>
        <div class="vboard board">${boardSVG(b, false)}</div></div>
      <div class="msg">${o.msg}</div><div class="acts">${o.acts}</div>${hand}`;
  } else {
    h = `${header}<div class="top">${cpuSeat}${crib('cpu')}</div>
      <div class="strip board">${boardSVG(b)}</div>
      <div class="mid"><div class="side">${starter}</div><div class="pa">${center}</div></div>
      <div class="msg">${o.msg}</div><div class="acts">${o.acts}</div>${me}${hand}
      <div class="foot">v0.1.0 · Send feedback</div>`;
  }
  return `<div class="ph">${h}${o.over || ''}</div>`;
}

// counting area in the middle of the table
const countHTML = (label, cards, starter, say = '&nbsp;', extra = '') =>
  `<div class="cl">${label}</div><div class="cards">${cards.map(c => card(c, 'sm')).join('')}<span class="gap"></span>${card(starter, 'sm')}</div><div class="say">${say}</div>${extra}`;

// celebrations (Big moments)
const burst = `<svg viewBox="0 0 200 200" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"><ellipse cx="100" cy="104" rx="56" ry="44" fill="var(--mark)" stroke="none" transform="rotate(-12 100 104)"/>${Array.from({ length: 16 }, (_, i) => { const a = i * Math.PI / 8, r1 = 70, r2 = i % 2 ? 84 : 94; return `<line x1="${100 + r1 * Math.cos(a)}" y1="${100 + r1 * Math.sin(a)}" x2="${100 + r2 * Math.cos(a)}" y2="${100 + r2 * Math.sin(a)}"/>`; }).join('')}</svg>`;
const smallBurst = `<svg viewBox="0 0 200 200" fill="none" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"><circle cx="100" cy="104" r="44" fill="var(--mark)" stroke="none"/>${Array.from({ length: 8 }, (_, i) => { const a = i * Math.PI / 4 + .4; return `<line x1="${100 + 62 * Math.cos(a)}" y1="${100 + 62 * Math.sin(a)}" x2="${100 + 76 * Math.cos(a)}" y2="${100 + 76 * Math.sin(a)}"/>`; }).join('')}</svg>`;

// ---------- frame helpers ----------
// Count a hand one combination at a time, ~1.2 s each. Tap skips to the total.
function countFrame(cap, base, { label, cards, starter, steps, total, extra = '' }) {
  return {
    cap: cap + '<span class="tap">Plays by itself, about 1.2 s per combination. Tap once to skip to the total, again to go on.</span>',
    html: () => T({ ...base, center: countHTML(label, cards, starter, '&nbsp;', extra) }),
    manual: true,
    after(root, api) {
      let i = 0;
      const sayEl = root.querySelector('.say');
      const light = ids => root.querySelectorAll('.pa .cd[data-id]').forEach(c => c.classList.toggle('hl', ids.includes(c.dataset.id)));
      const finish = () => { light([]); sayEl.innerHTML = `${label.replace(/:.*/, '')}: <b>${total}</b>`; api.pegs(); };
      const run = () => {
        if (i >= steps.length) return api.later(finish, 900);
        const [ids, words] = steps[i++];
        light(ids); sayEl.innerHTML = words;
        api.later(run, 1200);
      };
      api.later(run, 500);
      api.onTap(() => { api.cancel(); finish(); });
    }
  };
}

  { cap: '<b>19 hand</b> (a zero hand), tongue in cheek and smallest: a shrug, not a party.',
    html: T({ ...E0, starter: 'KC', center: countHTML('Your hand', ['2C', '4D', '6S', '8H'], 'KC', 'Nothing at all.'), over: cele('19', 'Nineteen.', 'Cribbage talk for zero, since no hand can score 19.', true) }) },
  { cap: '<b>Game over with a skunk.</b> Final scores, what the skunk means, and a games-won tally for this visit (a skunk counts 2, a double skunk 3). The tally lives in memory only.',
    html: T({ ...E0, sc: [121, 84], board: { mode: 'strip', you: [113, 121], cpu: [78, 84] }, over: sheet(`<h2>You win, with a skunk!</h2><div style="display:flex;justify-content:center;gap:26px;margin:4px 0 12px"><div class="serif" style="font-size:28px">121<div style="font:11px system-ui;color:#777">You</div></div><div class="serif" style="font-size:28px">84<div style="font:11px system-ui;color:#777">Computer</div></div></div><p>Computer finished under 91, so this win counts as 2 games.</p><p style="font-size:13px;color:#555;border-top:1px solid #ddd;padding-top:10px">Games won this visit<br><b>You 3 · Computer 1</b></p><span class="btn pri">Play again</span>`) }) },
  { cap: '<b>Game over mid-count.</b> The game ends the instant someone reaches 121, even in the middle of pegging or counting. The count stops, the board shows the winning peg in the last hole, then the game-over sheet.',
    html: T({ ...E0, sc: [118, 112], scAfter: 121, center: countHTML('Your hand', ['4C', '5H', '5S', '6D'], 'KD', 'Fifteen two… <b>121!</b> Game over.'), board: { mode: 'strip', you: [110, 118], cpu: [104, 112], move: { who: 'you', to: 121 } } }) }
]};

// Menu and the level-change question
SEQ.M = { title: 'Menu: Cribbage settings', frames: [
  { cap: 'The Menu, like Euchre and Pitch, plus two Cribbage settings: Muggins (follows the level: off for Easy/Medium, on for Hard, unless you change it) and Counting (animate or totals only).',
    html: T({ ...C0, sc: [50, 48], peg: { cards: [], count: 0 }, over: sheet(`<h2>Menu</h2><div class="set"><h3>How well the computer plays</h3><div class="seg"><span>Easy</span><span class="on">Medium</span><span>Hard</span></div><div class="note">Friendly. Plays sensibly, like a casual player.</div><h3>Muggins</h3><div class="seg"><span>Off</span><span class="on">On</span></div><div class="note">You count your own hands. Miss points and Computer takes them. (Hard turns this on.)</div><h3>Counting</h3><div class="seg"><span class="on">Animate the count</span><span>Totals only</span></div><h3>Game speed</h3><div class="seg"><span>Slow</span><span class="on">Normal</span><span>Fast</span></div></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:14px"><span class="btn pri">New game</span><span class="btn">Rules</span></div><div style="display:flex;justify-content:space-between;margin-top:14px;font-size:14px"><u>‹ All games</u><span class="btn">Done</span></div>`) }) },
  { cap: 'Changing the level or muggins mid-game asks first. Continue starts a new game at the new setting; Cancel leaves the game untouched.',
    html: T({ ...C0, sc: [50, 48], peg: { cards: [], count: 0 }, over: sheet(`<p style="font-size:16px;margin-top:6px">Changing levels will start a new game. Continue?</p><div style="display:flex;gap:8px;justify-content:center"><span class="btn">Cancel</span><span class="btn pri">Continue</span></div>`) }) }
]};

const DECISIONS = [
  ['Table layout', 'Layout 1 (board across, one row of played cards) or Layout 2 (board up the side, each player’s cards in front of them)? Or mix: e.g. Layout 1 with cards in front of each player.'],
  ['Board direction', 'Lying across the table (Layout 1) or standing up along the side (Layout 2)? Either way it stays small and the pegs move in place, no zoom.'],
  ['Peg colors', 'You red (outer lane), Computer blue (inner lane). OK, or the other way round?'],
  ['Counting area', 'Hands are counted in the middle of the table (where pegging happens). OK, or a pop-up sheet instead?'],
  ['Muggins input', 'Tap combinations, enter a number, or both (tap first, with an “Enter a number” button)?'],
  ['Muggins hints', 'When you tap cards, should the button name what they make (“Add fifteen (2)”, friendlier) or just say “Add” and reveal mistakes only at Done (stricter, more like real muggins)?'],
  ['Muggins on Hard', 'Default on with your override (as written), or required on Hard (your new idea)?'],
  ['Crib button', '“Send to Computer’s crib” / “Send to your crib”: OK?'],
  ['Celebrations', 'Size and tone of 29 / Muggins / 19 OK? Keep the odds line on 29?'],
  ['Games-won tally', 'Lives in memory for this visit: it resets when you go back to the game list or close the page. OK, or carry it in the link like settings so it survives a trip to the game list?']
];

// ---------- the player ----------
const app = document.getElementById('app');
let seq = null, idx = 0, timers = [], tapHook = null;
const api = {
  later(fn, ms) { timers.push(setTimeout(fn, ms)); },
  cancel() { timers.forEach(clearTimeout); timers = []; },
  onTap(fn) { tapHook = fn; },
  // Step each moving peg hole by hole along its lane (about 1 second in all), then update the score.
  pegs() {
    let longest = 0;
    app.querySelectorAll('[data-mv]').forEach(g => {
      const from = +g.dataset.from, to = +g.dataset.to, lane = +g.dataset.lane, across = !!g.dataset.across;
      const steps = to - from, ms = Math.min(110, 1000 / Math.max(steps, 1));
      longest = Math.max(longest, steps * ms);
      g.style.transition = `transform ${ms}ms linear`;
      for (let i = 1; i <= steps; i++) api.later(() => { const [x, y] = holeXY(from + i, lane, across); g.style.transform = `translate(${x}px,${y}px)`; }, i * ms);
    });
    api.later(() => app.querySelectorAll('[data-final]').forEach(b => { b.textContent = b.dataset.final; }), longest + 100);
  }
};

function home() {
  api.cancel(); tapHook = null; seq = null;
  const item = (k, t, s) => `<a href="#${k}"><b>${k}</b><span>${t}<small>${s}</small></span></a>`;
  app.innerHTML = `<div class="home"><h1>Cribbage wireframes</h1>
    <p>Rough on purpose: gray boxes, fake cards, no rules running. Tap anywhere on a screen to go to the next one. The yellow strip explains what you’re looking at.</p>
    <h2>Scenarios</h2>
    ${item('A', 'Dealing and the crib', 'Cut for deal, 6 cards, choose 2, crib, starter, his heels')}
    ${item('B', 'Pegging', '15, pair, go, 31 and reset, run, last card')}
    ${item('C1', 'Counting: auto-count', 'Your hand, dealer’s hand, crib; totals-only setting')}
    ${item('C2', 'Counting: muggins, tap combinations', 'You count; Computer calls Muggins!')}
    ${item('C3', 'Counting: muggins, enter a number', 'The quicker way to count')}
    ${item('D', 'The board and moving the pegs', 'Real-style board, red and blue pegs, skunk lines')}
    <h2>Layout</h2>
    ${item('L', 'Two layouts for the main table', 'Where the board, crib, starter and pegging area sit')}
    <h2>Extras</h2>
    ${item('E', 'Big moments and game over', '29, Muggins steal, 19, skunk, ending mid-count')}
    ${item('M', 'Menu and the level-change question', 'Muggins and counting settings')}
    <h2>Your call</h2>
    ${item('?', 'Decisions I need from you', DECISIONS.length + ' questions before PR 1')}
    </div>`;
}

function decisions() {
  app.innerHTML = `<div class="bar"><button data-nav="home">‹ All</button><span class="where">Decisions for PR 1</span></div>
    <div class="home"><h1>Your call</h1><p>Answer in chat, e.g. “1: Layout 2, 2: D2…”</p>
    ${DECISIONS.map(([t, q], i) => `<a style="display:block"><b style="display:inline">${i + 1}. ${t}</b><small style="font-size:14px;color:#333;margin-top:4px">${q}</small></a>`).join('')}</div>`;
}

function show() {
  api.cancel(); tapHook = null;
  const f = seq.frames[idx];
  app.innerHTML = `<div class="bar"><button data-nav="back">‹</button><span class="where">${seq.title} · ${idx + 1}/${seq.frames.length}</span><button data-nav="home">✕</button></div>
    <div class="cap">${f.cap}${f.manual ? '' : '<span class="tap">Tap anywhere to continue.</span>'}</div>
    <div id="stage">${typeof f.html === 'function' ? f.html() : f.html}</div>`;
  const stage = document.getElementById('stage');
  if (f.after) f.after(stage, api);
  if (!f.manual) api.later(() => api.pegs(), 500);
}

app.addEventListener('click', e => {
  const n = e.target.closest('[data-nav]');
  if (n) {
    if (n.dataset.nav === 'home') { location.hash = ''; return; }
    if (n.dataset.nav === 'back' && seq) { if (idx > 0) { idx--; show(); } else location.hash = ''; }
    return;
  }
  if (!seq || !e.target.closest('#stage, .cap')) return;
  if (tapHook) { const fn = tapHook; tapHook = null; fn(); return; }
  if (idx < seq.frames.length - 1) { idx++; show(); window.scrollTo(0, 0); }
  else location.hash = '';
});

function route() {
  const k = decodeURIComponent(location.hash.slice(1));
  if (k === '?') { seq = null; return decisions(); }
  if (SEQ[k]) { seq = SEQ[k]; idx = 0; return show(); }
  home();
}
window.addEventListener('hashchange', route);
route();
</script>
