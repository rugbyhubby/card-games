<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Grandma Dot wireframes</title>
<!--
  Learn Euchre with Grandma Dot, Step 1: sketches and clickable wireframes.
  Deliberately rough: gray boxes, simple cards, fake data, tap to advance.
  No game rules run here and nothing is saved. Not linked from the game list,
  not saved for offline.
-->
<script>/* Light / Dark switch for checking the sketches; follows the phone unless you pick one. */(function(){var m=/[?&]theme=(light|dark)/.exec(location.search);if(m)document.documentElement.dataset.theme=m[1];})();</script>
<style>
:root{--bg:#fff;--ink:#222;--mute:#767676;--line:#bdbdbd;--fill:#e8e8e8;--mark:#ffe14d;--mark-ink:#222;--cap:#fff7cc;--capline:#e3cf63;--capink:#6a5a00;--shade:rgba(0,0,0,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#18181a;--ink:#ececec;--mute:#9a9a9a;--line:#4d4d50;--fill:#2b2b2e;--mark:#e6c62e;--mark-ink:#1a1a1a;--cap:#33301a;--capline:#6b5c1a;--capink:#e9d77c;--shade:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#18181a;--ink:#ececec;--mute:#9a9a9a;--line:#4d4d50;--fill:#2b2b2e;--mark:#e6c62e;--mark-ink:#1a1a1a;--cap:#33301a;--capline:#6b5c1a;--capink:#e9d77c;--shade:rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
#app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
.serif{font-family:Georgia,serif}
.occ{fill:var(--bg)}
svg.dot{display:block;width:100%;height:auto;overflow:visible}

/* wireframe chrome (not part of the design) */
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:6px;background:#333;color:#fff;padding:calc(env(safe-area-inset-top) + 7px) 8px 7px;font-size:13px}
.bar .b{border:1px solid #888;border-radius:6px;color:#fff;padding:3px 8px;font-size:13px}
.bar .where{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tk{display:flex;border:1px solid #888;border-radius:6px;overflow:hidden}
.bar .tk button{color:#fff;padding:3px 7px;font-size:12px}
.bar .tk button.on{background:#fff;color:#222}
.cap{background:var(--cap);border-bottom:1px solid var(--capline);color:var(--ink);padding:8px 12px;font-size:13.5px;min-height:52px}
.cap .tap{display:block;margin-top:3px;font-size:11.5px;color:var(--capink)}

/* home and lists */
.home{padding:14px 14px 40px}
.home h1{font:400 30px Georgia,serif;margin:4px 0 2px}
.home p{margin:4px 0 12px;color:var(--mute);font-size:14px}
.home h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:20px 0 6px}
.home a{display:flex;gap:10px;align-items:baseline;padding:11px 4px;border-bottom:1px solid var(--fill);color:inherit;text-decoration:none}
.home a b{width:30px;flex:none;font-family:Georgia,serif;font-weight:400;font-size:19px}
.home a span{flex:1}
.home a small{display:block;color:var(--mute);font-size:12.5px}
.hero{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}
.hero div{width:96px;text-align:center;font-size:12px;color:var(--mute)}

/* Part A gallery */
.gal{padding:10px 10px 40px}
.gal .takes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.gal .takes div{font-size:12px;line-height:1.3}
.gal .takes b{display:block;font:400 17px Georgia,serif}
.gal .takes small{color:var(--mute)}
.gal h3{margin:16px 0 2px;font-size:14px}
.gal h3 small{font-weight:400;color:var(--mute);margin-left:4px}
.gal .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gal .cell{border:1px solid var(--fill);border-radius:10px;padding:6px 6px 2px;position:relative}
.gal .cell i{position:absolute;left:6px;top:4px;font:normal 12px Georgia,serif;color:var(--mute)}
.big{position:fixed;inset:0;z-index:40;background:var(--shade);display:grid;place-items:center;padding:20px}
.big svg{color:var(--ink)}
.big div{background:var(--bg);border-radius:16px;padding:16px;width:min(90vw,360px);text-align:center;font-size:13px;color:var(--mute)}

/* the phone table */
.ph{flex:1;display:flex;flex-direction:column;padding:4px 12px 10px;position:relative;overflow:hidden;min-height:640px}
.hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1.5px solid var(--ink);padding:2px 0 5px}
.hd .t{font:400 26px Georgia,serif}
.hd .s{display:flex;gap:14px}
.hd .s div{text-align:center;line-height:1}
.hd .s b{display:block;font:400 25px Georgia,serif}
.hd .s span{font-size:11px;color:var(--mute)}
.ctl{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);padding:5px 0 3px}
.ctl u{color:var(--ink)}
.lbar{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:5px 6px 5px 10px;font-size:12.5px;margin:2px 0 4px}
.lbar .lx b{font-weight:600}
.lbar .pr{display:flex;gap:3px;margin-left:2px}
.lbar .pr i{width:7px;height:7px;border-radius:50%;border:1.2px solid var(--ink)}
.lbar .pr i.on{background:var(--ink)}
.lbar .grow{flex:1}
.pill{border:1.5px solid var(--ink);border-radius:99px;padding:4px 10px;font-size:12.5px;white-space:nowrap}
.pill.off{opacity:.35;border-style:dashed}
.pill.hot{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.lbar.bottom{margin:4px 0 0}

/* Dot's seat (Partner, across the table) */
.north{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;min-height:118px;position:relative}
.dseat{display:flex;flex-direction:column;align-items:center;position:relative}
.dseat .fig{width:var(--dot,84px);color:var(--ink)}
.dseat .fig.ring{border:1.5px solid var(--ink);border-radius:50%;overflow:hidden;width:var(--dot,84px);height:var(--dot,84px);padding:4px 0 0}
.tag{font-size:11.5px;border:1.2px solid var(--ink);border-radius:5px;padding:0 6px;margin-top:2px;white-space:nowrap;background:var(--bg)}
.tag.grot{background:var(--mark);color:var(--mark-ink);border-color:var(--mark);font-weight:600}
.props{display:flex;align-items:flex-end;justify-content:flex-end;gap:6px;padding-right:4px}
.say{justify-self:start;position:relative;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.3;padding:6px 9px;border-radius:12px;max-width:150px;animation:pop .25s ease-out}
.say::before{content:"";position:absolute;left:-5px;top:14px;border:5px solid transparent;border-left:0;border-right-color:var(--ink)}
.say.why{background:var(--bg);color:var(--ink);border:1.5px dashed var(--ink)}
.say.why::before{border-right-color:var(--ink)}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
.dseat.tapme .fig{animation:ring 1.2s ease-in-out infinite;border-radius:50%}
@keyframes ring{50%{box-shadow:0 0 0 6px var(--mark)}}
.dhand{display:flex;gap:2px;margin-top:3px}

.napkin{width:38px;height:34px;color:var(--ink)}
.mugsm{width:22px;color:var(--ink)}
.napkin .new{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .5s .7s forwards;stroke-width:2}
@keyframes draw{to{stroke-dashoffset:0}}

.mid{display:grid;grid-template-columns:58px 1fr 58px;gap:6px;align-items:center;margin:2px 0}
.side{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px}
.av{width:40px;height:40px;border:1.5px solid var(--ink);border-radius:50%;background:var(--fill)}
.vh{display:flex;flex-direction:column;gap:1px;margin-top:2px}
.trick{border:1.5px dashed var(--line);border-radius:16px;height:196px;position:relative}
.trick .slot{position:absolute;transform:translate(-50%,-50%)}
.trick .N{left:50%;top:25%}.trick .S{left:50%;top:75%}.trick .W{left:22%;top:50%}.trick .E{left:78%;top:50%}
.trick .note{position:absolute;inset:auto 0 6px;text-align:center;font-size:11.5px;color:var(--mute)}
.banner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--mark);color:var(--mark-ink);font-weight:600;padding:5px 12px;border-radius:99px;font-size:13px;white-space:nowrap;z-index:4;animation:pop .3s}
.me{display:flex;justify-content:center;align-items:center;gap:7px;font-size:13px;min-height:26px;position:relative}
.me i{width:22px;height:22px;border:1.5px solid var(--ink);border-radius:50%;background:var(--fill)}
.msg{text-align:center;font-size:14px;min-height:22px;padding:3px 4px}
.hand{display:flex;justify-content:center;gap:5px;padding:8px 0 4px;position:relative}

/* cards (white in both themes, like the real game) */
.cd{width:44px;height:62px;border:1.5px solid #1d1d1f;border-radius:5px;background:#fff;color:#1d1d1f;position:relative;font:600 16px system-ui,sans-serif;padding:3px 4px;flex:none;line-height:1;transition:transform .2s,opacity .2s}
.cd i{display:block;font-style:normal;font-weight:400;font-size:12px;margin-top:2px}
.cd.r{color:#c22}
.cd .p{position:absolute;right:4px;bottom:3px;font-size:18px;font-weight:400}
.cd.sm{width:24px;height:33px;font-size:11px;padding:2px 2px;border-radius:3px}
.cd.sm i{font-size:9px;margin-top:0}
.cd.sm .p{display:none}
.hand .cd{width:min(15vw,58px);height:calc(min(15vw,58px)*1.4);font-size:20px}
.hand .cd .p{font-size:26px}
.hand .cd i{font-size:15px}
.cd.glow{box-shadow:0 0 0 3px var(--mark)}
.cd.dim{opacity:.3}
.cd.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cd.up{transform:translateY(-10px)}
.cd.try{animation:pulse 1.1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px var(--mark)}}
.arrow{position:absolute;font-size:30px;line-height:1;color:var(--ink);animation:bob .8s ease-in-out infinite;z-index:5}
@keyframes bob{50%{transform:translateY(-6px)}}

/* the trump ladder (lesson 1) */
.ladder{position:absolute;left:8px;right:8px;top:36px;height:90px}
.ladder .lab{position:absolute;left:0;top:-22px;font-size:11.5px;color:var(--mute)}
.ladder .cd{position:absolute;transition:left .8s cubic-bezier(.3,1.5,.5,1),top .8s cubic-bezier(.3,1.5,.5,1)}
.ladder .cd.hop{animation:hop .8s ease-out}
@keyframes hop{40%{transform:translateY(-26px) rotate(-8deg)}}
.ladder .boss{position:absolute;top:39px;font-size:10.5px;color:var(--mute);white-space:nowrap;opacity:0;transition:opacity .4s .8s}
.ladder.done .boss{opacity:1}

/* rule card sliding in from the edge (lesson 2) */
.rule{position:absolute;right:0;top:268px;width:200px;background:var(--bg);border:1.5px solid var(--ink);border-right:0;border-radius:12px 0 0 12px;padding:9px 12px;font-size:13px;z-index:6;transform:translateX(105%);transition:transform .45s ease}
.rule b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.rule.in{transform:translateX(0)}

/* sheets */
.ov{position:absolute;inset:0;background:var(--shade);display:grid;place-items:center;z-index:20;padding:16px}
.sheet{background:var(--bg);border:1.5px solid var(--ink);border-radius:16px;padding:16px;width:100%;text-align:center}
.sheet h2{font:400 28px Georgia,serif;margin:0 0 6px}
.sheet p{margin:0 0 12px;font-size:14px}
.btns{display:flex;gap:8px;justify-content:center}
.btn{border:1.5px solid var(--ink);border-radius:99px;padding:8px 18px;font-size:14px}
.btn.pri{background:var(--ink);color:var(--bg)}

/* game list mock */
.gl{padding:6px 14px}
.gl h1{font:400 30px Georgia,serif;margin:6px 0;border-bottom:1.5px solid var(--ink);padding-bottom:6px;display:flex;justify-content:space-between;align-items:flex-end}
.gl h1 u{font:13px system-ui;color:var(--ink)}
.grow-row{display:flex;align-items:center;gap:10px;padding:14px 2px;border-bottom:1.5px solid var(--fill)}
.grow-row .nm{flex:1}
.grow-row .nm b{display:block;font:400 30px Georgia,serif;line-height:1}
.grow-row .nm small{color:var(--mute);font-size:12.5px}
.grow-row.soon b{color:var(--mute)}
.learn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:14px;padding:4px 12px 4px 6px;margin:-4px 2px 10px;font-size:14px;width:calc(100% - 4px)}
.learn .fig{width:40px}
.learn small{display:block;color:var(--mute);font-size:11.5px}
.learn.hot{box-shadow:0 0 0 3px var(--mark)}

/* lesson picker */
.pick{padding:8px 14px 20px}
.pick .top{display:grid;grid-template-columns:110px 1fr;gap:6px;align-items:center;margin:6px 0 8px}
.pick ol{list-style:none;margin:0;padding:0}
.pick li{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--fill)}
.pick li .n{width:28px;height:28px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font:400 16px Georgia,serif;flex:none}
.pick li.done .n{background:var(--ink);color:var(--bg)}
.pick li span{flex:1;font-size:14px}
.pick li small{display:block;color:var(--mute);font-size:12px}
.pick li em{font-style:normal;font-size:12px;color:var(--mute)}
.pick li.next{background:var(--fill);border-radius:10px}

/* kitchen interlude */
.kitchen{position:absolute;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;animation:fadein .4s}
@keyframes fadein{from{opacity:0}}
.kitchen svg{width:100%;max-width:340px;color:var(--ink)}
.kitchen .line{font:400 20px Georgia,serif;text-align:center;min-height:52px}
.kitchen .prog{width:70%;height:4px;background:var(--fill);border-radius:2px;overflow:hidden}
.kitchen .prog i{display:block;height:100%;background:var(--ink);width:0}
@keyframes fill{to{width:100%}}
.kitchen .skip{font-size:12px;color:var(--mute)}
.durs{display:flex;gap:6px;font-size:12px;align-items:center}
.durs button{border:1px solid var(--line);border-radius:6px;padding:2px 8px}
.durs button.on{background:var(--ink);color:var(--bg)}

/* certificate */
.cert{border:4px double var(--ink);border-radius:6px;padding:18px 14px;text-align:center;background:var(--bg);width:100%}
.cert h2{font:400 28px Georgia,serif;margin:0}
.cert .sub{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:2px 0 12px}
.cert .who{font:italic 22px Georgia,serif;border-bottom:1px solid var(--ink);display:inline-block;padding:0 20px 2px;margin-bottom:10px}
.cert p{font:400 18px Georgia,serif;margin:8px 0 14px}
.cert .sig{display:flex;justify-content:space-between;align-items:flex-end;font-size:11px;color:var(--mute);margin-top:6px}
.cert .sig b{display:block;font:italic 30px 'Snell Roundhand','Brush Script MT',cursive;color:var(--ink);border-bottom:1px solid var(--ink);padding:0 10px;font-weight:400}
.cert .seal{width:56px;height:56px;border:1.5px dashed var(--ink);border-radius:50%;display:grid;place-items:center;font-size:10px;line-height:1.1;color:var(--ink)}

/* layout options */
.opt{font-size:12px;color:var(--mute);text-align:center;margin:4px 0}
.hint-ring{outline:2px dashed var(--mark);outline-offset:3px;border-radius:12px}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="app.js"></script>
</body>
</html>
