<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Euchre">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>Euchre</title>
<script>/* Use the theme from the link right away, so the page doesn't flash the other theme first. */(function(){var m=/[#&]theme=(light|dark)(&|$)/.exec(location.hash);if(m)document.documentElement.dataset.theme=m[1];})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../shared/theme.css">
<link rel="stylesheet" href="../../../shared/parts.css">
<style>
/* Euchre only: trump badge and the turned-up card pile in the center */
.trump{position:absolute;top:8px;left:10px;font-size:12px;color:var(--muted);line-height:1.3}
.trump b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;color:var(--ink)}
.trump b.r{color:var(--red)}
.pile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.pile .stack{position:relative;width:var(--cw);height:var(--ch)}
.pile .stack .card{position:absolute;left:0;top:0}
.pile .stack .card:nth-child(1){transform:translate(-3px,3px)}
.pile .stack .card:nth-child(2){transform:translate(-1.5px,1.5px)}
.pile .cap{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
