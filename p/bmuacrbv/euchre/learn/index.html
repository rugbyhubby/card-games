<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Learn Euchre">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181a" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<title>Learn Euchre with Grandma Dot</title>
<script>/* Use the theme from the link right away, so the page doesn't flash the other theme first. */(function(){var m=/[#&]theme=(light|dark)(&|$)/.exec(location.hash);if(m)document.documentElement.dataset.theme=m[1];})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../shared/theme.css">
<link rel="stylesheet" href="../../../../shared/parts.css">
<style>
/* From Euchre: trump badge and the turned-up card pile in the center */
.trump{position:absolute;top:8px;left:10px;font-size:12px;color:var(--muted);line-height:1.3}
.trump b{display:block;font-family:var(--serif);font-weight:400;font-size:24px;color:var(--ink)}
.trump b.r{color:var(--red)}
.pile{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.pile .stack{position:relative;width:var(--cw);height:var(--ch)}
.pile .stack .card{position:absolute;left:0;top:0}
.pile .stack .card:nth-child(1){transform:translate(-3px,3px)}
.pile .stack .card:nth-child(2){transform:translate(-1.5px,1.5px)}
.pile .cap{font-size:12px;color:var(--muted);text-align:center}

/* ---------- Learn with Grandma Dot ---------- */
/* Face-up lessons: pack the side hands tighter and use a shorter middle. */
.table.faceup .center{height:clamp(150px,22vh,200px)}
.table.faceup .upfan.v .card + .card{margin-top:-21px}
.table.faceup .dotseat .upfan{margin-top:1px}
.paper{fill:var(--paper)}

/* lesson picker */
.controls a.link{color:inherit;font-size:15px}
.greet{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;margin:8px 0 6px}
.dotbig img{display:block;width:100%;border-radius:14px;background:#fff}
.say{position:relative;background:var(--ink);color:var(--paper);font-size:13px;line-height:1.35;padding:7px 10px;border-radius:12px;animation:sayin .25s ease-out}
.greet .say::before,.dotseat .say::before{content:"";position:absolute;left:-5px;top:14px;border:5px solid transparent;border-left:0;border-right-color:var(--ink)}
@keyframes sayin{from{opacity:0;transform:scale(.92)}}
.lessons{list-style:none;margin:6px 0 0;padding:0}
.lesson{display:flex;align-items:center;gap:10px;width:100%;padding:10px 4px;border:0;border-bottom:1px solid var(--faint);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.lesson .n{width:30px;height:30px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:17px;flex:none}
.lesson .t{flex:1;font-size:15px}
.lesson small{display:block;color:var(--muted);font-size:12.5px}
.lesson em{font-style:normal;font-size:12.5px;color:var(--muted)}
.lesson.done .n{background:var(--ink);color:var(--paper)}
.lesson.next{background:var(--faint);border-radius:12px}
.lesson.next em{color:var(--ink);font-weight:600}
.lesson.soon{opacity:.45;cursor:default}
.lesson .star{border-style:dashed}
.fine{font-size:12px;color:var(--muted);margin:10px 0}

/* lesson bar */
.lbar{display:flex;align-items:center;gap:7px;border:1.5px solid var(--faint);border-radius:12px;padding:4px 5px 4px 10px;font-size:12.5px;margin:2px 0 0}
.lbar .pr{display:flex;gap:3px}
.lbar .pr i{width:7px;height:7px;border-radius:50%;border:1.2px solid var(--ink)}
.lbar .pr i.on{background:var(--ink)}
.lbar .grow{flex:1}
.pill{border:1.5px solid var(--ink);border-radius:99px;padding:4px 10px;font-size:12.5px;background:none;color:inherit;font-family:inherit;white-space:nowrap;cursor:pointer}
.pill:disabled{opacity:.35;cursor:default}

/* Dot in the Partner seat: napkin and mug on her left, speech bubble on her right */
.dotseat{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;margin:0 auto;width:90px}
.dfig{width:50px;height:50px;border-radius:50%;border:1.5px solid var(--ink);overflow:hidden;position:relative;background:#fff;padding:0;cursor:pointer}
.dfig img.crop{position:absolute;width:161%;max-width:none;left:-32%;top:-22%}
.dotseat.turn .dfig{box-shadow:0 0 0 4px var(--mark)}
.dfig.askme{animation:askme 1.2s ease-in-out infinite}
@keyframes askme{50%{box-shadow:0 0 0 6px var(--mark)}}
.dname{font-size:13px;display:flex;gap:4px;align-items:center;margin-top:3px;white-space:nowrap}
.dotseat .props{position:absolute;right:calc(100% + 6px);top:6px;display:flex;align-items:flex-end;gap:5px;color:var(--ink)}
.napkin{width:38px;height:32px}
.mug{width:20px}
.napkin .new{stroke-dasharray:20;stroke-dashoffset:20;animation:draw .5s .9s forwards;stroke-width:2.2}
@keyframes draw{to{stroke-dashoffset:0}}
.dotseat .say{position:absolute;left:calc(100% + 8px);top:0;width:max-content;max-width:min(150px,calc(50vw - 62px));z-index:4}
.dotseat .say.why{background:var(--paper);color:var(--ink);border:1.5px dashed var(--ink)}
.upfan{display:flex;gap:2px;margin-top:2px}
.upfan.v{flex-direction:column;gap:0}
.upfan.v .card + .card{margin-top:-20px}
.card.sm{--cw:24px;--ch:33px;padding:0;border-radius:3px}
.card.sm .ix{font-size:11px;left:2px;top:2px}.card.sm .ix i{font-size:9px}
.card.sm .pip{display:none}
.card.glow{box-shadow:0 0 0 3px var(--mark)}
.banner{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--mark);color:var(--mark-ink);font-weight:600;padding:4px 12px;border-radius:99px;font-size:12.5px;white-space:nowrap;z-index:3}

/* Next: small, on the right */
.nextrow{width:100%;display:flex;justify-content:flex-end}
.pill.next{font-size:14px;padding:6px 16px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
/* Hint while bidding: the button Dot would press */
.btn.hinted{box-shadow:0 0 0 3px var(--mark)}
/* your hand: hint arrow, wrong-card shake */
.hc{position:relative;display:flex}
.hc .arrow{position:absolute;left:50%;top:-30px;margin-left:-8px;font-size:24px;line-height:1;color:var(--ink);animation:bob .8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.card.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Lesson 1: the trump ladder, Jacks jump to the top */
.ladder{position:absolute;left:8px;right:8px;top:64px;height:80px;z-index:2}
.ladder .lab{position:absolute;left:0;top:-17px;font-size:11px;color:var(--muted)}
.lcard{position:absolute;left:calc(var(--x) * 27px);top:calc(var(--y) * 28px);width:24px;height:33px;border:1.5px solid #1d1d1f;border-radius:3px;background:#fff;color:#1d1d1f;font:600 11px/1 var(--sans);padding:2px;transition:left .8s cubic-bezier(.3,1.5,.5,1),top .8s cubic-bezier(.3,1.5,.5,1)}
.lcard i{display:block;font-style:normal;font-size:9px;font-weight:400}
.lcard.r{color:var(--red)}
.ladder.go .lcard{left:calc(var(--ex) * 27px);top:0}
.ladder.go .lcard.jack{animation:hop .8s ease-out;box-shadow:0 0 0 3px var(--mark)}
@keyframes hop{40%{transform:translateY(-24px) rotate(-8deg)}}
.ladder .boss{position:absolute;left:0;top:38px;font-size:10.5px;color:var(--muted);opacity:0;transition:opacity .4s .8s}
.ladder.go .boss{opacity:1}

/* effects layer above the table: rule card, napkin, kitchen */
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
.rule{position:absolute;right:0;top:46%;width:210px;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-right:0;border-radius:12px 0 0 12px;padding:9px 12px;font-size:13px;transform:translateX(105%);transition:transform .45s ease}
.rule b{display:block;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
.rule.in{transform:translateX(0)}
.napshow{position:absolute;left:50%;top:44%;text-align:center;transform:translate(-50%,-50%);animation:napin 3.4s ease forwards;color:var(--ink)}
.napshow svg{width:262px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.25))}
.napshow .new{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .5s .8s forwards}
.napshow .newt{opacity:0;animation:fadeto .4s 1.2s forwards}
.napshow .ncap{display:inline-block;font:600 20px 'Bradley Hand','Segoe Print','Comic Sans MS',cursive;margin-top:4px;color:var(--paper);background:var(--ink);padding:2px 14px;border-radius:99px}
@keyframes fadeto{to{opacity:1}}
@keyframes napin{0%{opacity:0;transform:translate(-120%,-160%) scale(.18)}14%{opacity:1;transform:translate(-50%,-50%) scale(1)}84%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-120%,-160%) scale(.18)}}
.kitchen{position:absolute;inset:0;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;pointer-events:auto;cursor:pointer}
.kitchen{animation:kin .4s}
@keyframes kin{from{opacity:0}}
.kitchen svg{width:100%;max-width:340px}
.kitchen .why{border:1.5px solid var(--ink);border-radius:10px;padding:6px 12px;font-size:14px;text-align:center;max-width:300px}
.kitchen .why b{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kitchen .kdot{width:160px;margin-top:-6px}
.kitchen .kdot img{display:block;width:100%;border-radius:12px;background:#fff}
.kitchen .kline{font:400 20px var(--serif);text-align:center;min-height:52px;max-width:320px}
.kitchen .kprog{width:70%;height:4px;background:var(--faint);border-radius:2px;overflow:hidden}
.kitchen .kprog i{display:block;height:100%;background:var(--ink);width:0;animation:fill var(--kms,3000ms) linear forwards}
@keyframes fill{to{width:100%}}
.kitchen .kskip{font-size:12px;color:var(--muted)}

/* sheets: leaving, lesson done */
.dotsheet .dotpic{width:120px;margin:0 auto 6px}
.dotsheet .dotpic img{display:block;width:100%;border-radius:12px;background:#fff}
.dotsheet .sayline{font:400 19px/1.3 var(--serif);margin:4px 0 12px}
.ask-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app"></div>
<div id="fx" aria-live="polite"></div>
<div id="sheet" hidden></div>
<script type="module" src="main.js"></script>
</body>
</html>
