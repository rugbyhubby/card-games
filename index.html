<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Nothing to see here</title>
<style>
  :root{--paper:#fff;--ink:#1d1d1f;color-scheme:light}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#18181a;--ink:#efeff2;color-scheme:dark}}
  :root[data-theme="dark"]{--paper:#18181a;--ink:#efeff2;color-scheme:dark}
  html,body{height:100%;margin:0}
  body{background:var(--paper);color:var(--ink);display:grid;place-items:center;padding:16px;
    font-family:system-ui,-apple-system,'Helvetica Neue',sans-serif;font-size:17px}
</style>
</head>
<body>
<p>Nothing to see here yet.</p>
</body>
</html>
